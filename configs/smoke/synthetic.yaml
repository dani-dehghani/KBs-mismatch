experiment_name: synthetic-smoke
seed: 7
output_dir: outputs

data:
  name: synthetic
  batch_size: 32
  num_workers: 0
  train_size: 128
  val_size: 64
  test_size: 64
  num_classes: 4
  image_size: 16

model:
  name: tiny_cnn
  embedding_dim: 32

training:
  epochs: 2
  learning_rate: 0.003
  weight_decay: 0.0001
  device: cpu
  deterministic: true
